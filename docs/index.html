<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>键盘侠模拟器</title>
    <style>
      :root {
        --paper: #f7f7f7;
        --surface: #fff;
        --ink: #171717;
        --mute: #5e5e5e;
        --rule: #e4e4e4;
        --seal: #c8102e;
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        overflow-x: clip;
        font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      }
      button, a { font: inherit; }
      button { cursor: pointer; }
      .bar { height: 4px; background: var(--seal); }
      .wrap { max-width: 32rem; margin: 0 auto; padding: 0.75rem 1rem calc(5.75rem + env(safe-area-inset-bottom)); }
      h1 { font-family: "Songti SC", "Noto Serif SC", serif; font-weight: 650; font-size: clamp(1.35rem, 5vw, 1.75rem); line-height: 1.35; margin: 1rem 0 0; }
      .screen { min-height: 100dvh; display: flex; flex-direction: column; }
      .hero { flex: 1; display: flex; flex-direction: column; justify-content: space-between; padding: 1.5rem 1.25rem calc(1.5rem + env(safe-area-inset-bottom)); }
      .seal-btn, .ghost-btn, .red-play {
        display: inline-flex; align-items: center; justify-content: center;
        min-height: 3rem; border: 0; text-decoration: none; font-size: 1rem;
      }
      .seal-btn { background: var(--seal); color: var(--surface); }
      .wide { width: 100%; min-height: 3.5rem; }
      .ghost-btn { background: var(--surface); color: var(--ink); border: 1px solid var(--ink); }
      .player { width: fit-content; max-width: 100%; margin: 0 auto; border: 1px solid var(--rule); background: var(--surface); }
      .stage {
        position: relative;
        aspect-ratio: 9 / 16;
        width: min(92vw, 22rem);
        margin: 0 auto;
        overflow: hidden;
        background: #111;
        transform: translateZ(0);
      }
      .stage video { position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%; object-fit: contain; background: #111; }
      .danmaku { position: absolute; inset: 0 0 2.6rem 0; z-index: 3; overflow: hidden; pointer-events: none; }
      .playbar { display: flex; width: 100%; min-height: 3rem; align-items: center; justify-content: center; background: var(--seal); color: #fff; border: 0; }
      .fly {
        position: absolute; left: 100%; top: 0; white-space: nowrap;
        color: #fff; font-size: 0.9rem; text-shadow: 0 1px 2px rgb(0 0 0 / 0.9);
        animation: fly 11s linear infinite;
        animation-play-state: paused;
      }
      .stage.on .fly { animation-play-state: running; }
      .mine {
        border: 2px solid #fff; background: rgb(0 0 0 / 0.72); padding: 0.15rem 0.45rem;
      }
      .hold {
        position: absolute; top: 2.5rem; left: 0.6rem; right: 0.6rem; z-index: 4;
        border: 2px solid #fff; background: rgb(0 0 0 / 0.72); color: #fff;
        padding: 0.35rem 0.5rem; font-size: 0.9rem; line-height: 1.45;
      }
      @keyframes fly { to { transform: translate3d(-120vw, 0, 0); } }
      .note { border: 1px solid var(--rule); background: #fff; }
      .note-head { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; }
      .avatar { width: 2.75rem; height: 2.75rem; border-radius: 999px; display: grid; place-items: center; background: var(--seal); color: #fff; flex: none; }
      .follow-chip { border: 1px solid var(--seal); color: var(--seal); background: #fff; height: 2rem; padding: 0 0.75rem; }
      .note-body { margin: 0; padding: 0 1rem 1rem; line-height: 1.7; font-size: 1rem; }
      .note-acts { display: flex; gap: 1.25rem; border-top: 1px solid var(--rule); padding: 0.75rem 1rem; font-size: 0.875rem; }
      .note-replies { max-height: 13rem; overflow-y: auto; border-top: 1px solid var(--rule); }
      .reply { padding: 0.75rem 1rem; border-bottom: 1px solid var(--rule); }
      .reply small { color: var(--mute); display: block; }
      .reply.mine { border-bottom-color: var(--seal); background: var(--paper); }
      .reply.mine small { color: var(--seal); }
      .reply p { margin: 0.25rem 0 0; line-height: 1.6; }
      .player.full { width: 100%; border: 0; background: transparent; }
      .news { border: 1px solid var(--rule); background: #fff; }
      .news-kicker { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--rule); padding: 0.6rem 1rem; }
      .news-kicker strong { color: var(--seal); font-family: "Songti SC", "Noto Serif SC", serif; font-weight: 650; }
      .news h2 { margin: 0; padding: 1rem 1rem 0; font-family: "Songti SC", "Noto Serif SC", serif; font-size: 1.25rem; line-height: 1.4; }
      .news img { display: block; width: 100%; height: auto; margin-top: 0.75rem; }
      .blank {
        aspect-ratio: 16/9; display: grid; place-items: center; background: #111; color: #fff;
      }
      .mark {
        width: 4rem; height: 4rem; display: grid; place-items: center;
        border: 2px solid var(--seal); color: var(--seal); font-family: "Songti SC", serif; font-size: 1.5rem;
      }
      .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-top: 1rem; }
      .topbar { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.75rem; padding: 0.75rem 1rem 0; max-width: 32rem; margin: 0 auto; }
      .follow {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
        width: 100%; min-height: 3.25rem;
        border: 0; border-top: 1px solid var(--rule);
        background: var(--paper); color: var(--seal);
        padding: 0.75rem 1rem calc(0.75rem + env(safe-area-inset-bottom));
      }
      .follow span {
        display: flex; align-items: center; justify-content: center;
        height: 3rem; border: 1px solid var(--seal); background: #fff;
      }
      .sheet {
        position: fixed; inset: 0; z-index: 40; background: rgb(0 0 0 / 0.35);
        display: grid; align-items: end;
      }
      .card {
        background: #fff; width: 100%;
        padding: 1rem 1rem calc(1rem + env(safe-area-inset-bottom));
        max-height: 88dvh; overflow: auto;
      }
      .opt {
        display: block; width: 100%; text-align: left; background: #fff;
        border: 1px solid var(--rule); padding: 0.85rem 1rem; margin-top: 0.75rem;
        min-height: 3.25rem;
      }
      .opt small { color: var(--seal); display: block; margin-bottom: 0.2rem; }
      .muted { color: var(--mute); }
      .hidden { display: none !important; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      const LEVELS = [
        {
          title: "学校辟谣学生升旗老师台下给校长打伞：俩人系父女，已报警",
          video: "videos/level-1.mp4",
          summary: "女教师在操场上为身旁背手站立的年长男子撑伞，被配以“讨好校领导”“职场谄媚”的解读，引发声讨。学校工作人员向媒体称两人是父女关系。",
          danmaku: ["作秀","谄媚","带节奏","真是父女","讨好领导","给校长打伞","背手像检阅","就一把伞，刻意","学校的解释我不信","报警两个字在带节奏","职场谄媚，看不下去","如果是父女，标题就在带节奏","升旗仪式上还打伞，画面太怪了","女老师撑伞，男的背手，谁看了不多想","评论区已经判完了，视频才放了几秒","先别急着骂，等官方把关系说清楚"],
          comments: [
            ["跟随大部分人的看法", "就是讨好校领导，父女是借口"],
            ["故意和弹幕风向反着来", "父女撑伞很正常，别跟着骂"],
            ["先独立思考再发表评论", "画面容易让人误会，但学校说是父女，先别按标题定罪"],
            ["不发表任何评论", ""]
          ],
          follow: "两人并非父女，男子是一名退休返聘老教师。事件经历“网友质疑—校方称父女—教育局否认父女”的多次反转。反转本身也可能是一种新的片面；调查不是等一个“说法”就收手，而是直到完整事实经得起核实。",
          followVideo: "videos/level-1-follow.mp4"
        },
        {
          title: "",
          video: "",
          note: "年轻女孩儿注意了⚠️在长沙五一附近跟朋友出去玩，刚下车遇到老太太要我们给她带路，说她眼睛不好看不见，我们拒绝了。结果在朋友店门口看见七人众万巡有一位小女孩带她进去小巷子里，感觉不对劲，为什么偏偏挑女性，路边也有男性，我马上出去把那个小女孩叫过来，叫她别去小心点，这个女孩儿过来了之后我们就在她后面看着，发现这个老太太居然能看手机？！我就联想到网络上发的那些诱骗年轻女生的视频，想想都毛骨悚然……",
          likes: 6821,
          saves: 3546,
          replies: [
            ["晚风不晚", "这就是拐卖，长沙的姐妹先别单独出门。"],
            ["路过五一", "能看手机就是装瞎，拐人已经实锤了。"],
            ["热心市民", "专挑女生，典型团伙，看见直接扭走。"],
            ["别装了", "还跟她客气什么，这种人就该当场收拾。"],
            ["先问清楚", "能看手机只能说明她不是全盲，还不能认定是诱拐。先把经过问清，再交给派出所核实。"]
          ],
          summary: "",
          danmaku: [],
          comments: [
            ["跟随大部分人的看法", "能看手机就是装瞎，这就是拐卖。"],
            ["故意和评论风向反着来", "看手机不等于拐人，别跟着认定。"],
            ["先独立思考再发表评论", "现在只能说她不是全盲，还不能按拐卖下结论，先交给派出所核实。"],
            ["不发表任何评论", ""]
          ],
          follow: "经证实，刘奶奶73岁，确为视力一级残疾，使用的是装有读屏功能的手机，通过语音反馈操作，并非“看得见却装盲”。拍摄者随后道歉，承认对盲人的理解太片面。“盲人不可能用手机”本身就是未经调查的预设；调查研究要用一手事实打断“想当然”的链条。注意，“专挑女性”是拍摄者的单方面描述，不是经核实的事实。",
          followVideo: "videos/level-2-follow.mp4"
        },
        { title: "家园被毁！湖南石门县两位基层村支书忍不住哭了！", video: "", image: "images/level-3.png", likes: 7436, saves: 3182,
          replies: [
            ["看图说话", "这金耳环一看就是别人送的，基层干部哪买得起。"],
            ["路过石门", "来历不说清就是收的礼，哭也没用。"],
            ["围观群众", "这么粗的金圈，不是工资买得起的。"],
            ["不信泪", "先别哭，把耳环是谁送的交代清楚。"],
            ["先核对", "耳环的来历不能靠画面猜。材质、价格和购买记录都还没核实，不能据此否定她在灾区的工作。"]
          ],
          summary: "", danmaku: [],
          comments: [
            ["跟随大部分人的看法", "金耳环来历不明，不像自己买的。"],
            ["故意和评论风向反着来", "耳环来历不明不等于受贿，别跟着定罪。"],
            ["先独立思考再发表评论", "现在只能看到她戴了耳环，来历还没核实，不能按贪腐下结论。"],
            ["不发表任何评论", ""]
          ],
          follow: "实际情况是，湖南石门县龙池河村支书向金元连续多日奋战在防汛一线，全村927人零伤亡；被质疑的耳环网购不到100元。2026年6月，公安部网安局披露依法查处网暴行为15起，对相关人员进行行政处罚。坐在屏幕前仅凭一副耳环否定基层干部在洪水中的全部付出，正是缺乏调查研究、以碎片表象审判基层的典型表现。",
          followVideo: "videos/level-3-follow.mp4"
        }
      ];
      const ORD = ["一", "二", "三", "四", "五"];
      const state = { view: "title", level: 0, panel: "", choice: null, playing: false };

      function el(html) {
        const root = document.createElement("div");
        root.innerHTML = html;
        return root;
      }

      function render() {
        const app = document.getElementById("app");
        app.replaceChildren();
        if (state.view === "title") {
          app.append(el(`
            <main class="screen">
              <div class="bar"></div>
              <div class="hero">
                <div>
                  <p class="muted">闯关演示</p>
                  <h1 style="font-size:2rem;margin:0.5rem 0">键盘侠模拟器</h1>
                  <p class="muted">一部视频，两个按钮，一次选择。</p>
                  <button class="seal-btn wide" id="start" style="margin-top:1.5rem">开始</button>
                </div>
              </div>
            </main>`));
          document.getElementById("start").onclick = () => { state.view = "play"; state.level = 0; state.panel = ""; state.choice = null; render(); };
          return;
        }
        const level = LEVELS[state.level];
        const posted = state.choice == null ? "" : (level.comments[state.choice][1] || "");
        const root = el(`
          <main>
            <div class="bar"></div>
            <header class="topbar">
              <div>
                <strong>键盘侠模拟器</strong>
                <p class="muted" style="margin:0.25rem 0 0">第 ${state.level + 1} 关 / 共 ${LEVELS.length} 关</p>
              </div>
              <button id="home" style="background:none;border:0;color:var(--mute)">回到开场</button>
            </header>
            <div class="wrap">
              <div class="player" id="player"></div>
              ${level.note || level.image ? "" : `<h1 style="font-size:1.5rem">${level.title || "第 " + (state.level + 1) + " 关"}</h1>${level.title ? "" : '<p class="muted">视频标题留白</p>'}`}
              <div class="${state.level === 1 ? "" : "grid2"}">
                ${state.level === 1 ? "" : '<button class="ghost-btn" id="summary">内容总结</button>'}
                <button class="seal-btn${state.level === 1 ? " wide" : ""}" id="comment">发表评论</button>
              </div>
              ${state.choice == null ? "" : `<p class="muted">本关选择 <span style="color:var(--ink)">${level.comments[state.choice][0]}</span></p>`}
            </div>
            <button class="follow" id="follow"><span>查看后续</span></button>
          </main>`);
        app.append(root);
        const player = document.getElementById("player");
        player.classList.toggle("full", Boolean(level.image));
        if (level.image) {
          const replies = (level.replies || []).map((item) => `<div class="reply"><small>${item[0]}</small><p>${item[1]}</p></div>`).join("");
          const mine = posted ? `<div class="reply mine"><small>我</small><p>${posted}</p></div>` : "";
          const count = (level.replies || []).length + (posted ? 1 : 0);
          player.innerHTML = `<article class="news"><header class="news-kicker"><strong>要闻</strong><span class="muted">社会</span></header><h2>${level.title}</h2><img src="${level.image}" alt="${level.title}"><div class="note-acts"><span>赞 ${level.likes || 0}</span><span>收藏 ${level.saves || 0}</span><span>评论 ${count}</span></div><div class="note-replies">${mine}${replies}</div></article>`;
        } else if (level.note) {
          const replies = (level.replies || []).map((item) => `<div class="reply"><small>${item[0]}</small><p>${item[1]}</p></div>`).join("");
          const mine = posted ? `<div class="reply mine"><small>我</small><p>${posted}</p></div>` : "";
          const count = (level.replies || []).length + (posted ? 1 : 0);
          player.innerHTML = `<article class="note"><header class="note-head"><div class="avatar">某</div><div style="flex:1"><strong>某用户</strong><p class="muted" style="padding:0;margin:0.15rem 0 0">笔记</p></div><span class="follow-chip">关注</span></header><p class="note-body">${level.note}</p><div class="note-acts"><span>赞 ${level.likes || 0}</span><span>收藏 ${level.saves || 0}</span><span>评论 ${count}</span></div><div class="note-replies">${mine}${replies}</div></article>`;
        } else if (level.video) {
          player.innerHTML = `<div class="stage" id="stage"><video id="vid" src="${level.video}" controls playsinline webkit-playsinline x5-playsinline x5-video-player-type="h5" x5-video-player-fullscreen="false" preload="auto"></video><div class="danmaku" id="danmaku"></div></div><button class="playbar" id="play" type="button">播放</button>`;
        } else {
          player.innerHTML = `<div class="blank"><div style="text-align:center"><div class="mark">留</div><p>画面留白</p></div></div>`;
        }
        document.getElementById("home").onclick = () => { state.view = "title"; render(); };
        const summary = document.getElementById("summary");
        const summaryText = level.summary || (level.image ? "这篇报道的内容总结留白。" : level.note ? "这篇笔记的内容总结留白。" : "此视频的内容总结留白。");
        if (summary) summary.onclick = () => openSheet("内容总结", summaryText);
        document.getElementById("comment").onclick = () => openComments(level);
        document.getElementById("follow").onclick = () => openFollow();
        const vid = document.getElementById("vid");
        if (vid) bindVideo(vid, level, posted);
        else drawDanmaku(document.getElementById("danmaku"), level.danmaku, posted, false);
        if (state.panel === "summary" && state.level !== 1) openSheet("内容总结", summaryText);
        if (state.panel === "comments") openComments(level);
        if (state.panel === "follow") openFollow();
      }

      function bindVideo(vid, level, posted) {
        const play = document.getElementById("play");
        const layer = document.getElementById("danmaku");
        function sync() {
          const on = !vid.paused && !vid.ended;
          play.textContent = vid.ended ? "重播" : on ? "暂停" : "播放";
          document.getElementById("stage").classList.toggle("on", on);
          drawDanmaku(layer, level.danmaku, posted, on);
        }
        play.onclick = () => {
          if (vid.ended) vid.currentTime = 0;
          const job = vid.paused ? vid.play() : vid.pause();
          if (job && job.catch) job.catch(() => {});
        };
        vid.addEventListener("error", () => {
          play.textContent = "视频没有加载上";
        });
        vid.addEventListener("play", sync);
        vid.addEventListener("pause", sync);
        vid.addEventListener("ended", sync);
        drawDanmaku(layer, level.danmaku, posted, false);
      }

      function drawDanmaku(layer, lines, posted, playing) {
        if (!layer) return;
        layer.replaceChildren();
        if (!playing && !posted) return;
        (lines || []).forEach((text, i) => {
          if (!playing) return;
          const span = document.createElement("span");
          span.className = "fly";
          span.textContent = text;
          span.style.marginTop = (4 + (i % 6) * 14) + "%";
          span.style.animationDelay = (-i * 0.85) + "s";
          layer.append(span);
        });
        if (!posted) return;
        if (playing) {
          const mine = document.createElement("span");
          mine.className = "fly mine";
          mine.textContent = posted;
          mine.style.marginTop = "18%";
          layer.append(mine);
          return;
        }
        const hold = document.createElement("p");
        hold.className = "hold";
        hold.textContent = posted;
        layer.append(hold);
      }

      function openSheet(title, body) {
        state.panel = title === "内容总结" ? "summary" : state.panel;
        closeSheet();
        const sheet = el(`<div class="sheet" id="sheet"><div class="card"><div style="display:flex;justify-content:space-between"><strong>${title}</strong><button id="close" style="border:0;background:none;font-size:1.25rem">×</button></div><p>${body}</p></div></div>`);
        document.body.append(sheet);
        document.getElementById("close").onclick = () => { state.panel = ""; closeSheet(); };
        sheet.firstElementChild.onclick = (event) => { if (event.target.id === "sheet") { state.panel = ""; closeSheet(); } };
      }

      function openComments(level) {
        state.panel = "comments";
        closeSheet();
        const opts = level.comments.map((item, i) => `<button class="opt" data-i="${i}"><small>选项${ORD[i]}</small>${item[0]}</button>`).join("");
        const sheet = el(`<div class="sheet" id="sheet"><div class="card"><div style="display:flex;justify-content:space-between"><strong>发表评论</strong><button id="close" style="border:0;background:none;font-size:1.25rem">×</button></div>${opts}</div></div>`);
        document.body.append(sheet);
        document.getElementById("close").onclick = () => { state.panel = ""; closeSheet(); };
        sheet.querySelectorAll("[data-i]").forEach((button) => {
          button.onclick = () => {
            state.choice = Number(button.getAttribute("data-i"));
            state.panel = "";
            closeSheet();
            render();
          };
        });
      }

      function openFollow() {
        state.panel = "follow";
        closeSheet();
        const level = LEVELS[state.level];
        const prev = state.level === 0 ? "" : `<button class="ghost-btn" id="prev">上一关</button>`;
        const next = state.level < LEVELS.length - 1 ? `<button class="seal-btn wide" id="next">下一关</button>` : `<button class="seal-btn wide" id="next">回到开场</button>`;
        const video = level.followVideo ? `<video id="follow-vid" src="${level.followVideo}" controls autoplay playsinline webkit-playsinline x5-playsinline x5-video-player-type="h5" x5-video-player-fullscreen="false" style="display:block;width:min(100%,16rem);aspect-ratio:9/16;object-fit:contain;background:#111;margin:0.75rem auto"></video>` : "";
        const copy = level.follow || `第 ${state.level + 1} 关的后续留白。`;
        const sheet = el(`<div class="sheet" id="sheet"><div class="card"><div style="display:flex;justify-content:space-between"><strong>后续</strong><button id="close" style="border:0;background:none;font-size:1.25rem">×</button></div>${video}<p>${copy}</p><div class="${state.level === 0 ? "" : "grid2"}" style="margin-top:1rem">${prev}${next}</div></div></div>`);
        document.body.append(sheet);
        const vid = document.getElementById("follow-vid");
        if (vid) {
          const start = () => {
            const job = vid.play();
            if (job && job.catch) job.catch(() => { vid.muted = true; vid.play().catch(() => {}); });
          };
          if (vid.readyState >= 2) start();
          else vid.addEventListener("loadeddata", start, { once: true });
        }
        document.getElementById("close").onclick = () => { state.panel = ""; closeSheet(); };
        const prevBtn = document.getElementById("prev");
        if (prevBtn) prevBtn.onclick = () => { state.level -= 1; state.choice = null; state.panel = ""; closeSheet(); render(); };
        document.getElementById("next").onclick = () => {
          if (state.level < LEVELS.length - 1) { state.level += 1; state.choice = null; state.panel = ""; }
          else state.view = "title";
          closeSheet();
          render();
        };
      }

      function closeSheet() {
        const old = document.getElementById("sheet");
        if (old) old.remove();
      }

      render();
    </script>
  </body>
</html>
